        WIS: 14
        CHA: 11
      skills:
        Medicine: 4
        Religion: 2
      senses: passive Perception 12
      languages: any one language (usually Common)
      cr: 1/4
      xp: 50
      traits:
      - name: Spellcasting
        text: 'The acolyte is a 1st-level spellcaster. Its spellcasting ability is
          Wisdom (spell save DC 12, +4 to hit with spell attacks). The acolyte has
          following cleric spells prepared: Cantrips (at will): light, sacred flame,
          thaumaturgy 1st level (3 slots): bless, cure wounds, sanctuary'
      actions:
      - name: Club
        text: 'Melee Weapon Attack: +2 to hit, reach 5 ft., one target. Hit: 2 (1d4)
          bludgeoning damage.'
      - name: Acolytes
        text: are junior members of a clergy, usually answerable to a priest. They
          perform a variety of functions in a temple and are granted minor spellcasting
          power by their deities.
