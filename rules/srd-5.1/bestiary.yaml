# Bestiary — SRD 5.1
#
# This work includes material taken from the System Reference Document 5.1
# ("SRD 5.1") by Wizards of the Coast LLC and available at
# https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1
# is licensed under the Creative Commons Attribution 4.0 International
# License, available at
# https://creativecommons.org/licenses/by/4.0/legalcode.
#
# PROVENANCE — read before editing.
#
# Every creature in the SRD 5.1 monster section and its NPC and creature
# appendices. Built from reference/dnd.srd.5.1-main (one markdown file per
# creature) and cross-checked against the second, independent conversion in
# reference/dnd-5e-srd-master.
#
# Of 314 creatures present in both, their Armor Class, Hit Points and
# Challenge agreed on all but one:
#
#   * Acolyte — dnd-5e-srd-master gives AC 12, HP 99, CR 12. Those are the
#     Archmage's stats. The two blocks sit in adjacent columns on page 395
#     of the SRD PDF and that conversion merged them. The printed page says
#     AC 10, HP 9 (2d8), CR 1/4, which is what is recorded here. Verified
#     by reading the page directly.
#
# Entries use the same schema as an adventure's own monsters/*.yaml, so the
# engine loads and displays both through one code path.
#
# The brief calls for a small shared bestiary, expanded only once a second
# adventure shows what repeats. The full set is included here at the
# maintainer's explicit request.

monsters:
  - meta: Large aberration, lawful evil
    name: Aboleth
    stat_block:
      ac: 17
      ac_note: natural armor
      hp: 135
      hit_dice: 18d10+36
      speed: 10 ft., swim 40 ft.
      abilities:
        STR: 21
        DEX: 9
        CON: 15
        INT: 18
        WIS: 15
        CHA: 18
      saves:
        Con: 6
        Int: 8
        Wis: 6
      skills:
        History: 12
        Perception: 10
      senses: darkvision 120 ft., passive Perception 20
      languages: Deep Speech, telepathy 120 ft.
      cr: '10'
      xp: 5900
      traits:
      - name: Amphibious
        text: The aboleth can breathe air and water.
      - name: Mucous Cloud
        text: While underwater, the aboleth is surrounded by transformative mucus.
          A creature that touches the aboleth or that hits it with a melee attack
          while within 5 feet of it must make a DC 14 Constitution saving throw. On
          a failure, the creature is diseased for 1d4 hours. The diseased creature
          can breathe only underwater.
      - name: Probing Telepathy
        text: If a creature communicates telepathically with the aboleth, the aboleth
          learns the creature's greatest desires if the aboleth can see the creature.
      actions:
      - name: Multiattack
        text: The aboleth makes three tentacle attacks.
      - name: Tentacle
        text: 'Melee Weapon Attack: +9 to hit, reach 10 ft., one target. Hit: 12 (2d6+5)
          bludgeoning damage. If the target is a creature, it must succeed on a DC
          14 Constitution saving throw or become diseased. The disease has no effect
          for 1 minute and can be removed by any magic that cures disease. After 1
          minute, the diseased creature''s skin becomes translucent and slimy, the
          creature can''t regain hit points unless it is underwater, and the disease
          can be removed only by heal or another disease-curing spell of 6th level
          or higher. When the creature is outside a body of water, it takes 6 (1d12)
          acid damage every 10 minutes unless moisture is applied to the skin before
          10 minutes have passed.'
      - name: Tail
        text: 'Melee Weapon Attack: +9 to hit, reach 10 ft. one target. Hit: 15 (3d6+5)
          bludgeoning damage.'
      - name: Enslave (3/Day)
        text: The aboleth targets one creature it can see within 30 feet of it. The
          target must succeed on a DC 14 Wisdom saving throw or be magically charmed
          by the aboleth until the aboleth dies or until it is on a different plane
          of existence from the target. The charmed target is under the aboleth's
          control and can't take reactions, and the aboleth and the target can communicate
          telepathically with each other over any distance. Whenever the charmed target
          takes damage, the target can repeat the saving throw. On a success, the
          effect ends. No more than once every 24 hours, the target can also repeat
          the saving throw when it is at least 1 mile away from the aboleth.
      legendary_actions:
      - name: Detect
        text: The aboleth makes a Wisdom (Perception) check.
      - name: Tail Swipe
        text: The aboleth makes one tail attack.
      - name: Psychic Drain (Costs 2 Actions)
        text: One creature charmed by the aboleth takes 10 (3d6) psychic damage, and
          the aboleth regains hit points equal to the damage the creature takes.
  - meta: Medium humanoid (any race), any alignment
    name: Acolyte
    stat_block:
      ac: 10
