# Finethir Shinebright — the sheep. Personality per the module's
# "Roleplaying Shinebright" and the how-to-run guide's NPC notes.

name: Finethir Shinebright
summary: A master transmuter, currently a sheep, and no humbler for it.

motivation: Get his wand back and be an elf again. He will promise the
  party anything at all to make that happen, with no regard for whether he
  can deliver — and he cannot; Noke is virtually bankrupt.

attitude: Arrogant, fussy, bookish, entirely self-obsessed — and, in sheep
  form, completely adorable. Play the gap between the two for laughs. He is
  good-hearted underneath, and will help people if it doesn't inconvenience
  him, while loudly despairing of their inability to grasp concepts as
  simple as poly-planal transweave theory.

combat_behavior: Always acts on initiative count 1. On his turn he asks the
  nearest player character what he should do, and does it. He has no attacks
  worth the name — he is a sheep. Uses pony statistics if he ever needs
  them, with Intelligence 18 and Wisdom 14.

improv_notes: |
  He considers the party expendable and will always push for violence
  against Noke. He thinks Guz is a useless idiot and Noke a talentless
  hack, and says so.

  Having him ask a player what to do each round is the single most useful
  thing he does at the table: it hands quiet players a prompt, and it makes
  new players feel like someone is looking to them for direction.

  He is presumed dead by the world at large. He was prickly about who he
  dealt with, so nobody looked very hard.

  Two years as a sheep have taught him very little about humility and a
  great deal about grass. If restored, he is a willow-thin high elf with
  straw-coloured hair and an extremely long nose.

  If he sees Noke's corpse, he may quietly realise how badly he treated the
  boy. Play that straight — it is the emotional beat of the adventure, and
  it lands better unspoken than explained.
